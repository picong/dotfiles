# Protect the interactive session layer (compositor, panel, input method) from
# being reclaimed into swap. memory.min propagates top-down, so this slice must
# carry the reservation for niri.service's MemoryMin to have any effect.
# (保护交互会话层：合成器、面板、输入法不被回收进 swap。
#  memory.min 是自上而下传递的，niri.service 的 MemoryMin 要生效，
#  这一级 slice 必须先持有预留额。)
[Slice]
MemoryMin=512M
