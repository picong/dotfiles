# Never let the compositor be swapped out.
#
# Root cause of the "hotkeys and pointer both dead for 5-15s, then fine" freeze:
# niri had VmSwap=49MB / majflt=100285. Its event loop would touch a swapped-out
# page and block on a synchronous read from the btrfs swapfile. With 12544 pages
# at ~0.4ms each that is ~5s of a fully unresponsive compositor.
# niri's anon footprint is only ~100MB, so pinning it is cheap.
#
# (「快捷键和鼠标同时失效 5-15 秒后自动恢复」的根因：niri 自己被换出 49MB，
#  事件循环碰到被换出的页就要同步等 btrfs swapfile 读回，12544 页 × 0.4ms ≈ 5 秒
#  期间合成器完全无响应。niri 匿名内存只有约 100MB，钉住成本很低。)
[Service]
MemorySwapMax=0
MemoryMin=512M
