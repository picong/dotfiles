# foot terminal configuration
# Font matched to kitty (JetBrains Maple Mono @ 13.5)

[main]
font=JetBrains Maple Mono:size=13.5
pad=5x5

[bell]
# Codex can use terminal attention signals when it needs approval or finishes a turn.
notify=yes

[desktop-notifications]
# Codex emits OSC 9 notifications; keep them visible even while foot has focus.
inhibit-when-focused=no
