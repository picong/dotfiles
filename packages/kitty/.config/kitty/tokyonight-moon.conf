# vim:ft=kitty

## name: Tokyo Night Moon
## license: MIT
## author: Folke Lemaitre
## upstream: https://github.com/folke/tokyonight.nvim/raw/main/extras/kitty/tokyonight_moon.conf
#
# Copied verbatim from tokyonight.nvim's official kitty extra so that kitty and
# nvim (LazyVim default: tokyonight style "moon") share one palette. The
# color0-15 values were verified against nvim's live terminal_color_* vars.
# (逐字复制自 tokyonight.nvim 官方 kitty 配色，使 kitty 与 nvim（LazyVim 默认
#  的 tokyonight moon）共用同一套调色板；color0-15 已与 nvim 运行时的
#  terminal_color_* 逐项核对一致。)

background #222436
foreground #c8d3f5
selection_background #2d3f76
selection_foreground #c8d3f5
url_color #4fd6be
cursor #c8d3f5
cursor_text_color #222436

# Tabs
active_tab_background #82aaff
active_tab_foreground #1e2030
inactive_tab_background #2f334d
inactive_tab_foreground #545c7e
# Upstream leaves these commented out, but dank-tabs.conf sets a Catppuccin
# #303446 that would otherwise leak through, so pin them to Tokyo Night.
# (上游默认注释掉这两项，但 dank-tabs.conf 里写死的 Catppuccin #303446 会漏
#  出来，因此显式固定为 Tokyo Night 的值。)
tab_bar_background #1b1d2b
tab_bar_margin_color #1b1d2b

# Windows
active_border_color #82aaff
inactive_border_color #2f334d

# normal
color0 #1b1d2b
color1 #ff757f
color2 #c3e88d
color3 #ffc777
color4 #82aaff
color5 #c099ff
color6 #86e1fc
color7 #828bb8

# bright
color8  #444a73
color9  #ff8d94
color10 #c7fb6d
color11 #ffd8ab
color12 #9ab8ff
color13 #caabff
color14 #b2ebff
color15 #c8d3f5

# extended colors
color16 #ff966c
color17 #c53b53

# Cursor trail matches the cursor color set above.
# (光标拖尾与上面的光标色保持一致。)
cursor_trail_color #c8d3f5
