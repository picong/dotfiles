include dank-tabs.conf
include mappings.conf
# include dank-theme.conf
# Window appearance (窗口外观)
window_padding_width 8
hide_window_decorations yes
# Transparency and blur are managed by Niri. (透明度和模糊由 Niri 管理。)
background_opacity 1.0
background_blur 0

# Typography (字体排版)
font_family Maple Mono NF CN
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.5
modify_font cell_height 108%
disable_ligatures never

# Nerd Font symbol map (Nerd Font 符号映射)
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b5,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Maple Mono NF CN
remember_window_size no
initial_window_width 1000
initial_window_height 700
confirm_os_window_close 0
# shell fish
# Cursor animation (光标动画)
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 15
cursor_trail 60
cursor_trail_decay 0.08 0.28
cursor_trail_start_threshold 1
shell_integration no-cursor

# Auto copy on mouse selection (鼠标选中自动复制到剪切板)
copy_on_select clipboard

# Allow clipboard operations (允许剪切板操作)
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask




# Full Tokyo Night Moon palette, so kitty matches nvim exactly instead of
# following Noctalia's wallpaper-derived (much darker) terminal colors.
# MUST stay after the Noctalia include above: Noctalia's apply.sh regenerates
# themes/noctalia.conf on every wallpaper change and would otherwise win.
# (改用完整的 Tokyo Night Moon 配色，使 kitty 与 nvim 完全一致，而不再跟随
#  Noctalia 按壁纸生成的偏暗终端色。必须放在上面的 Noctalia include 之后：
#  Noctalia 的 apply.sh 每次换壁纸都会重写 themes/noctalia.conf，否则会盖掉。)
include tokyonight-moon.conf
