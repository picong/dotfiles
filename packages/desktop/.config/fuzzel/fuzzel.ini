# fuzzel config — indigo/lavender theme (深靛蓝背景 + 淡紫薰衣草强调色)
[main]
font=Maple Mono NF:size=12
prompt=">  "
icon-theme=breeze
icons-enabled=yes
fields=name,generic,comment,categories,keywords
terminal=ghostty -e
layer=overlay
width=40
horizontal-pad=20
vertical-pad=16
inner-pad=8
line-height=22

[border]
width=2
radius=12

[colors]
background=191627f2
text=e2e2eaff
match=abb2e8ff
selection=b6b9d033
selection-text=ffffffff
selection-match=abb2e8ff
border=abb2e8ff
prompt=abb2e8ff
input=e2e2eaff
